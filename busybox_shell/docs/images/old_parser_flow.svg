<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Previous parser flow</title>
  <desc id="desc">Command text is split manually with strtok and split_line before dispatch_command executes it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3a4a"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #42526e; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font: 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #46556a; }
      .arrow { stroke: #2f3a4a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="30" y="70" width="170" height="82" class="box"/>
  <text x="115" y="105" text-anchor="middle" class="text">text line</text>
  <text x="115" y="130" text-anchor="middle" class="small">echo hello | wc</text>

  <line x1="205" y1="111" x2="285" y2="111" class="arrow"/>

  <rect x="295" y="70" width="190" height="82" class="warn"/>
  <text x="390" y="102" text-anchor="middle" class="text">manual parsing</text>
  <text x="390" y="128" text-anchor="middle" class="small">strtok / split_line</text>

  <line x1="490" y1="111" x2="570" y2="111" class="arrow"/>

  <rect x="580" y="70" width="150" height="82" class="box"/>
  <text x="655" y="105" text-anchor="middle" class="text">argc / argv</text>
  <text x="655" y="130" text-anchor="middle" class="small">flat tokens</text>

  <line x1="735" y1="111" x2="815" y2="111" class="arrow"/>

  <rect x="825" y="70" width="110" height="82" class="box"/>
  <text x="880" y="105" text-anchor="middle" class="text">execute</text>
  <text x="880" y="130" text-anchor="middle" class="small">dispatch</text>

  <text x="480" y="210" text-anchor="middle" class="small">Every shell feature needed more custom string splitting.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Shell layers</title>
  <desc id="desc">Three layers: BNFC grammar parser, shell core adapter and execution, and command modules.</desc>
  <defs>
    <style>
      .layer1 { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .layer2 { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .layer3 { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 10; }
      .text { font: 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; font-weight: 600; }
      .small { font: 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34445a; }
      .code { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <rect x="80" y="42" width="740" height="92" class="layer1"/>
  <text x="450" y="76" text-anchor="middle" class="text">Layer 1: Grammar / Parser</text>
  <text x="450" y="104" text-anchor="middle" class="small">Understands shell syntax and builds an AST</text>
  <text x="450" y="124" text-anchor="middle" class="code">busybox_shell/bnfc/Grammar.cf, Parser.c, Lexer.c, Absyn.h</text>

  <rect x="80" y="170" width="740" height="112" class="layer2"/>
  <text x="450" y="204" text-anchor="middle" class="text">Layer 2: Shell Core</text>
  <text x="450" y="232" text-anchor="middle" class="small">Walks AST, builds argc/argv, handles pipelines/redirection</text>
  <text x="450" y="252" text-anchor="middle" class="code">dispatch_bnfc_line(), bnfc_collect_pipeline(), execute_pipeline()</text>
  <text x="450" y="272" text-anchor="middle" class="code">busybox_shell/main.c</text>

  <rect x="80" y="318" width="740" height="70" class="layer3"/>
  <text x="450" y="350" text-anchor="middle" class="text">Layer 3: Command Modules</text>
  <text x="450" y="374" text-anchor="middle" class="code">cmd_echo.c, cmd_ls.c, cmd_cat.c, cmd_wc.c, ...</text>
</svg>
